<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webdev-Toolchain</title>
    <link rel="stylesheet" href="dist/css/style.css">
</head>
<body>
    <main class="container py-5">
        <h1 class="mb-4">Webdev-Toolchain</h1>

        <div class="row g-4">
            <section class="col-md-6" id="sass">
                <h2>Sass und Bootstrap</h2>
                <p>Sass kompiliert die ausgewählten Bootstrap-Module und die eigenen Stile.</p>
                <a class="btn btn-primary" href="#browsersync">
                    <i class="bi bi-rocket-takeoff" aria-hidden="true"></i>
                    Zum Live-Reload
                </a>
            </section>

            <section class="col-md-6" id="browsersync">
                <h2>BrowserSync</h2>
                <p>Änderungen an HTML und CSS werden direkt im Browser sichtbar.</p>
                <a class="btn btn-outline-primary" href="#sass">
                    <i class="bi bi-arrow-up-circle" aria-hidden="true"></i>
                    Zurück zu Sass
                </a>
            </section>
        </div>
    </main>
</body>
</html>
